# 智能药箱 · 四姿态复现 Demo 姿态表
# 改这里不用改代码；交互模式按 w 存回这个文件

gripper:
  open: 180.0     # 张开 / 上电复位（实测）
  close: 140.0    # ★ 夹药品（135 太紧卡死；禁止再调小）

poses:
  A:
    name: "复位立正"
    desc: "整机立起来收拢，末端在基座正上方略偏后（高 290mm）。照片一。"
    photo: "18eee6f1d07453b3a38574aeae978328.jpg"
    angles: [180.0, 120.0, 120.0, 180.0]

  B:
    name: "取【上层】药"
    desc: "底座立起、大臂抬到最高，小臂回折收回来，手停在最上面那层药前（高 215mm）。照片二。"
    photo: "77d0f915ec0d2fd33f79aac8860cf00.jpg"
    angles: [180.0, 120.0, 30.0, 180.0]

  C:
    name: "取【中层】药"
    desc: "底座立起、大臂放低，小臂往前伸出去，手伸到中间那层药前（高 194mm）。照片四。"
    photo: "fab052726cd4148dca8d9119fc44aab9.jpg"
    angles: [180.0, 40.0, 110.0, 140.0]

  D:
    name: "取【下层】药"
    desc: "底座放平、三段连杆摊开，手伸到最远最低（高 148mm）。照片三。"
    photo: "576a8acb27ddb761c825024ea4c66942.jpg"
    angles: [110.0, 120.0, 110.0, 140.0]

order: [A, B, C, D]
