# =============================================================================
# 智能药箱主控配置 (app.yaml)
# 所有参数集中在这里，改行为不用改代码
# =============================================================================

serial:
  port: COM12            # 串口号。Windows 设备管理器里看；Linux 用 /dev/ttyUSB0
  baud: 115200          # 波特率，必须与 STM32 下位机固件（0stm 工程）一致
  timeout: 3.0          # 等待 STM32 的 ACK/DONE 的默认超时（秒）

camera:
  index: 1              # 摄像头序号，0 通常是第一个。用 tools/camera_check.py --list 确认
  width: 1280           # 请求分辨率（相机会选最接近的）
  height: 720
  fps: 30
  # 手动曝光。★ auto_exposure=true 时它只作为"起点"，不再决定最终值 ★
  #   数值越大越亮（DSHOW 下曝光≈2^n 秒：-1=0.5s/帧≈2fps，-6≈1/64s/帧≈35fps）
  #   调法：python tools/camera_check.py --sweep
  exposure: -1

  # ★ 自适应曝光（推荐开着）：开相机时自动搜索曝光，使画面亮度 >= ae_target_lo，
  #   并取**最短曝光**（=最高帧率）。这样白天/晚上/换灯/换相机都不用改配置。
  #   本机实测：白天 -6 → 亮度149/35.4fps；晚上 -1 → 亮度35/1.9fps（无光则无解）。
  #   开它之后，"2fps 卡顿"在有光时自动变成 ~35fps；过曝/偏暗也自动纠正。
  auto_exposure: true
  ae_target_lo: 90       # 目标亮度下限（与 camera_check 的推荐区间一致）
  ae_target_hi: 160      # 目标亮度上限
  ae_min: -13            # 曝光搜索范围（最短曝光，=最暗/最快）
  ae_max: 0              # 曝光搜索范围（最长曝光，=最亮/最慢）
  ae_settle_frames: 5    # 每换一档曝光后丢弃几帧再测亮度（相机生效有延迟）

  # 白平衡。★ 换相机后务必用 python tools/camera_check.py --wb 复验 ★
  #   实测结论：本机 USB 相机**不支持**写死 WB 值
  #   （CAP_PROP_WHITE_BALANCE_BLUE_U / RED_U / TEMPERATURE 全部 get=-1、set 返回 False）。
  #   一旦 AUTO_WB=0，驱动会把色温增益打回出厂默认 -> 画面明显偏蓝
  #   （实测 R-B 由 +13 掉到 -25，HSV 色调由 32 跳到 93），槽底圆点/药瓶色块判据全乱。
  #
  #   true  = 保持相机自动白平衡（默认，推荐）。开机会多读 wb_settle_frames 帧等它收敛。
  #   false = 关自动白平衡并尝试写死下面两个值。相机不支持时会在启动时打印警告。
  auto_wb: true
  wb_blue_u: null        # 仅 auto_wb=false 时生效；相机不支持则被忽略
  wb_red_u: null
  # 白平衡预热的**上限**帧数。偏色一稳定就提前结束，不会死等满。
  #   实测（暗光 2fps）：45 帧上限下第 16 帧就收敛 → 打开耗时 26.9s 降到 12.3s，
  #   而画面色调 H 只差 1.8（第16帧 33.9 vs 第60帧 32.1，满量程 179）→ 可忽略。
  #   若相机/驱动不收敛，最多也就读满这个数。
  wb_settle_frames: 45

  # 采集后端。auto = Windows 上 MSMF→DSHOW 优先级（先锁 MJPG 再设分辨率）
  #   ★ 外接罗技 Brio 等 UVC 头：DSHOW 常协商 YUYV，720p 只有约 5fps；
  #     MSMF+MJPG 与内置头同路径，可到 20~30fps。故默认 auto 走 MSMF 优先。
  #   dshow / msmf / v4l2 = 强制指定（白平衡偏蓝时可强制 dshow 试）
  #   实测（1280x720, exposure=-1）：
  #     | 后端  | auto_wb=1 | auto_wb=0 | 帧率(Brio) |
  #     | MSMF  | R-B -32.0 | R-B -31.8 | 高(MJPG)  |  ← AUTO_WB 可能是哑的
  #     | DSHOW | R-B +11.7 | R-B -31.4 | 低(~5fps) |  ← 自动白平衡真正工作
  backend: auto

vision:
  require_slot_check: true   # 取药前是否要求视觉确认"槽位有药"
  # ★ 过检位扫码确认开关（2026-10-22 新增，默认 true 保留安全闭环）
  #   true  = 抓完自动挪到过检位扫码验药（防抓错，原设计）
  #   false = 夹紧后机械臂【保持姿态不动】-> 底盘退离 -> HC05 人工放药。
  #           扫码出库由人工环节完成（二次人工出库流程）
  require_scan_confirm: false
  inspect_roi: [340, 120, 600, 480]   # 过检瞄准框 [x,y,w,h]（仅提示举到哪）
  # 识别区域：false=整帧（与 tools/camera_preview.py 一致，手举手机/标签更稳）
  #           true = 只在 inspect_roi 内解码（货架背景干扰少，但稍偏就扫不到）
  inspect_use_roi: false
  scan_hold_s: 60.0          # 举码准备上限（秒）。有预览窗时等人按【空格】再扫
  scan_timeout_s: 12.0       # 过检扫码时间窗（秒）。同一码集满票会提前结束
  scan_frames: 80            # 时间窗内最多采样帧数（安全上限）
  scan_interval_s: 0.0       # 采样间隔。0=不额外 sleep（推荐，帧率跟相机/识别走）
  scan_min_votes: 2          # 同一码至少几帧一致才采信

timing:
  move_ms: 900          # 舵机默认运动时长（毫秒），越大越慢越稳
  settle_ms: 350        # 到位后等待抖动消失的时间（毫秒）—— 不要调小！
                        # 仿真证明：舵机刚停就拍照 = 运动模糊 = 二维码识别率 0%
  scan_frames: 80       # 扫码采样帧数上限（过检实际还受 scan_timeout_s 约束）

retry:
  max_attempts: 2       # 单次抓取失败后的重试次数
  delay_s: 0.5          # 重试间隔（秒）

# =============================================================================
# 工作模式  —— ★ 两种互斥模式，决定"底盘归谁控制" ★
# -----------------------------------------------------------------------------
# 系统有两种互斥的工作模式，同一时刻只能处于其中一种：
#
#   auto          全自动模式
#     PC 通过串口控制麦轮底盘横移对位，货架上的列二维码做位置校正。
#     底盘移动期间机械臂锁定（禁止抓取）；到位并读码确认锁死之后，
#     才执行机械臂抓取 -> 扫码核验 -> 移动到投放位 -> 释放。
#     适用：答辩演示完整闭环、无人值守取药。
#
#   manual_phone  手机手动底盘模式
#     **不生成任何底盘移动指令**（这是与 auto 的本质区别）。
#     PC 只输出"目标药品 + 目标列"，并用 TTS 提示操作人员
#     "请用手机蓝牙连接小车，把底盘移动到第 N 列，对位锁死后告诉我"。
#     人工对位并确认之后，再执行机械臂抓取、投放流程。
#     适用：货架/场地条件不适合自动对位，或二维码贴纸不全时降级使用。
#
# ★ 为什么这两个模式必须互斥
#   底盘只有一个（一块板子、一路电机驱动）。如果 auto 在发运动指令的
#   同时又允许手机推杆，两个"驾驶员"会互相覆盖 PWM，车会抖、会冲。
#   所以：
#     - 固件侧：$MV 下发后 300ms 内的手机命令一律忽略（见 main.c 的
#               HC05_PC_PRIORITY_MS），且机械臂动作期间底盘命令被拒。
#     - PC 侧：状态机在 manual_phone 下**根本不调用** arm.move_chassis()。
#   两侧同时保证，才不会出现"以为没动其实动了"的危险情况。
#
# ★ 安全约束（两种模式都生效，不可关闭）
#   1. 高风险药品（high_risk=true）必须语音二次确认，用户否认即取消；
#   2. 抓取失败最多重试 retry.max_attempts 次（默认 2），仍失败进 FAULT；
#   3. 全局急停优先级最高：任何时刻收到急停，立即停底盘 + 停机械臂。
# =============================================================================
# =============================================================================
# ★ 底盘对位参数（顶层键，auto 模式下 PC 控底盘横移用）
# -----------------------------------------------------------------------------
# ★ 历史坑：本段原来缩进在 box_layout 下面，而 state_machine 用顶层
#   cfg.get("chassis") 读取 —— 一直在走默认值，配置从未生效。已挪到顶层。
# =============================================================================
chassis:
  # ★ 分段横移（解决长行程电池压降 → 右前轮堵转）：
  #   lateral_pulse_mm = 每段横移覆盖的距离（0 = 不分段，一次性走完）。
  #   设 600 = 第 2 列 1 段、第 3 列 2 段（等价于 HC05 打一次/两次右移命令），
  #   段间停 lateral_pause_ms 让电池回血，避免持续大电流放电。
  lateral_pulse_mm: 600.0
  lateral_pause_ms: 800
  # ★ 速度上限百分比（$MC，固件默认 60，null=不改）。横移是麦轮最吃电流的
  #   方向，若轮子偶发堵转可提到 80~100 增大扭矩；但会加大电池压降——
  #   供电不稳时慎用（PC 启动时自动发送 $MC）
  speed_cap_pct: null
  # ★ 抓完药是否自动退离货架（$MV 后退）。2026-10-22 用户要求去掉：
  #   false = 夹住药后姿态冻结、不发指令，出槽由人工 HC05 开车完成
  auto_retreat: false
  # 底盘横移速度（归一化 0~1，即 $MV 的 x 分量占空比），越小越稳、越慢
  speed: 0.35
  # ★ 货架列间距(mm)：底盘横移一格 = 一列的宽度。
  #   实测一列约 60cm -> 600。之前代码错用了 box_layout.pitch_x(12mm，
  #   那是机械臂药槽间距)，导致"横移距离太小"——两者相差 50 倍。
  col_pitch_mm: 600.0
  # ★ 横移速度标定(mm/s @ speed=1.0)：实际速度(mm/s) = speed × 本系数。
  #   标定方法（做一次就够）：
  #     1) 串口助手/PC 发 $MV,0,1,0,1000 （全速向右横移 1 秒）
  #     2) 卷尺量这一秒走了多少 mm，例如 350mm
  #     3) speed_scale_mm_s: 350.0
  #   默认 100 是保守值；标定前对列会走得偏慢（600mm 约 17s，属正常）。
  speed_scale_mm_s: 100.0
  # 单次"移动到目标列"的超时(秒)，超时按失败处理
  # ★ 列距 600mm、speed=0.35、scale=100 时单程约 17s，此超时必须大于它；
  #   标定好 scale 后（速度上去）可调回 12。
  move_timeout_s: 30.0
  # 列二维码在货架上的内容前缀，如 COL1 / COL2 / COL3
  # 底盘到位后靠读这个码确认"确实在第 N 列"，而不是靠步数累计（会累积误差）
  col_qr_prefix: "COL"
  # 二维码校正的容差：允许底盘与目标列偏差多少 mm 仍算"到位"
  # ★ 列距放大到 600mm 后，开环时间控制的绝对误差会变大，
  #   若校正反复不通过重试超限，可放宽到 10~15
  align_tol_mm: 6.0
  # 校正不通过时最多重试几次
  align_retry: 2

work_mode:
  mode: auto            # auto | manual_phone。启动默认值；运行时可用 --mode 覆盖
  # 运行时是否允许用语音指令临时切换模式（"切换到手动模式"等）
  allow_voice_switch: true
  # manual_phone 模式下，等人工确认"已对位锁死"的超时(秒)。
  # 超时后按取消处理，不会硬等下去。
  manual_confirm_timeout_s: 180.0
  # manual_phone 模式下，TTS 要念几遍目标列（人工可能没听清）
  manual_prompt_repeat: 2

# =============================================================================
# 大模型配置  —— ★ 换模型 / 换供应商只改这一段，代码一行都不用动 ★
# -----------------------------------------------------------------------------
# 可用供应商预设（详见 pc/llm/providers.py，或运行 python -m pc.llm.providers）：
#   zhipu(智谱) deepseek(深度求索) dashscope(通义千问) moonshot(Kimi)
#   siliconflow(硅基流动) modelscope(魔搭) hunyuan(腾讯混元) stepfun(阶跃)
#   volcengine(火山方舟/豆包) qianfan(百度千帆) openai ollama(本地) custom(自建)
# 换供应商的最小操作：改 provider + model 两行即可；base_url 留空自动用预设。
# =============================================================================
llm:
  provider: zhipu              # 智谱 GLM（官方 OpenAI 兼容接口）
  # ★ 必须是 https://open.bigmodel.cn/api/paas/v4
  #   少了 /api/paas/v4 会打到官网页面接口 → HTTP 405 Not Allowed
  base_url:
  api_key: 
  api_key_env: ZHIPU_API_KEY   # api_key 留空时才读这个环境变量
  model: glm-4-flash           # 账号若只有 GLM-4.7-Flash 可改成这个
  timeout: 45
  retries: 2
  # prompt_template: |      # ← 可选：自定义 system prompt
  #   ...

  # ---- 下面是几个「照抄即用」的示例，需要哪个把上面几行替换成对应块 ----
  # 【换 DeepSeek】           key 放环境变量 DEEPSEEK_API_KEY
  #   provider: deepseek
  #   model: deepseek-chat
  # 【换通义千问】            key 放环境变量 DASHSCOPE_API_KEY
  #   provider: dashscope
  #   model: qwen-turbo
  # 【换 Kimi】               key 放环境变量 MOONSHOT_API_KEY
  #   provider: moonshot
  #   model: moonshot-v1-8k
  # 【换本地 Ollama 离线】     key 随便填 ollama；先 `ollama pull qwen2.5:7b`
  #   provider: ollama
  #   model: qwen2.5:7b
  # 【自建/其他 OpenAI 兼容服务，如 vLLM、one-api】
  #   provider: custom
  #   base_url: http://127.0.0.1:8000/v1
  #   model: Qwen2.5-7B-Instruct
  #   api_key: sk-随便填

audio:
  asr_model: paraformer-zh    # FunASR 中文模型
  vad_model: fsmn-vad         # 模型侧 VAD（切长音频）。不想用就留空字符串 ""
  punc_model: ct-punc         # 标点恢复，让文本带句号更像人话。留空则不加标点
  tts_backend: auto           # auto | pyttsx3 | edge | mock

paths:
  medicines: config/medicines.json   # 药品知识库
  poses: config/poses.json           # 机械臂预设点位表
  slots: config/slots.yaml           # 槽位相机 ROI（由 tools/calibrate_slots.py 生成）
  log: logs/run.log                  # 运行日志

# -----------------------------------------------------------------------------
# 机械臂几何尺寸（用于自动生成点位表，改机械臂后必须改这里并重跑 gen_poses.py）
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# 机械臂几何（★ 平面 3R 串联臂：3 个俯仰关节，末端在单一竖直平面内运动）
#
# 坐标系：x = 水平前方距离，z = 高度，单位 mm
#
#       Z(上)
#       |                 ◇ TCP（夹爪中心）
#       |                /
#       |            L3 /   第三段连杆（小臂 → 夹爪）
#       |              /
#       |         ● 关节3（腕）
#       |            |
#       |        L2  |      第二段连杆（大臂）
#       |            |
#       |       ● 关节2（肘）
#       |          |
#       |      L1  |        第一段连杆（底座段）
#       |          |
#       |     ● 关节1（底座俯仰关节）
#       |        |
#       |     H0 |         基座立柱
#       O--------+------------------> X
#       基座（固定在小车上）
#
# ★ 这些数字必须按实机测量后替换，否则生成的点位表是错的。
#   可达范围可用 python tools/kinematics_check.py 直接算出来。
# -----------------------------------------------------------------------------
arm_geometry:
  h0: 60.0        # 基座台面 -> 关节1(底座俯仰关节)转轴 的高度 mm
  l1: 100.0       # 第一段连杆 关节1 -> 关节2
  l2: 95.0        # 第二段连杆 关节2 -> 关节3
  l3: 55.0        # 第三段连杆 关节3 -> 夹爪中心(TCP)
  s0_home: 90.0   # 舵机 s0 取该角时，第一段连杆水平
  s1_home: 90.0   # 舵机 s1 取该角时，第二段与第一段共线
  s2_home: 180.0  # 舵机 s2 取该角时，第三段与第二段共线
                  # ★ 实机夹爪舵机中位(90°)时夹爪已朝下，故"共线"对应 180°。
                  #   错填 90 会让 s2 普遍偏小甚至变负（超固件限位），
                  #   工作空间也会被压窄一半（实测 49mm → 21mm）。
  # 舵机软限位不在这里配：权威定义在 pc/core/kinematics.py 的 SERVO_LIMITS，
  # 与固件 0stm/app/main.h 的 SERVOx_LIMIT_MIN/MAX_DEG 一一对应。
  # 注意各轴限位不同：s0=0~180、s1=15~165、s2=0~150、s3(夹爪)=140~180
  #   （★ 2026-10-22 实机复测：180°=复位/张开，140°=抓药夹紧，135 堵转卡死；LIMIT_MIN 已锁 140 防烧）。

# -----------------------------------------------------------------------------
# 药箱布局（★ 所有槽位必须排在【同一个竖直平面】内）
#
# 为什么：本机械臂没有底座旋转自由度，末端只能在一个竖直平面里前后/上下运动。
# 旧的"弧形布局（所有槽位等半径、靠底座转角区分）"在这个结构下【完全不成立】。
#
# 布局形状：
#   plane_grid  竖直平面内网格（cols 列 × rows 层，推荐）
#   plane_line  竖直平面内一排（同一高度，沿 x 等间距）
# -----------------------------------------------------------------------------
box_layout:
  shape: plane_grid   # plane_grid=平面网格(推荐) / plane_line=平面内一排
  count: 9            # 槽位数量 ★ 九宫格 3x3
  cols: 3             # plane_grid：列数（沿 x 方向）
  rows: 3             # plane_grid：层数（沿 z 方向）
  # ★★ 九宫格的 z 不再由 z_start/pitch_z 决定，而是直接用下面 layers 里
  #    三个实测姿态的高度（148.2 / 193.6 / 214.8）。这两个字段只在
  #    "没配 layers" 的老配置里当兜底用，留着以防回退。
  # ★★ x_start 只是"货架第 1 列的基准"，真正生成点位时用的是
  #    layers 里【每层各自的 x_start】（见下方注释）。这里保留是为了
  #    未配 layers 时仍能工作。
  x_start: 174.2      # 货架第 1 列对应的机械臂 x 基准（★ 等货架到货后按实物重测）
  pitch_x: 12.0       # 列间距 mm（上限 12.0，由中层公共半宽 12.0mm 定；★到货后按药瓶直径重定）
  z_start: 148.2      # 最下面一层的抓取高度 mm（= 实测姿态 D 的高度）
  pitch_z: 21.2       # 层间距 mm（实际 45.4 / 21.2 非均匀，仅供无 layers 时兜底）
  grasp_z: 65.0       # plane_line 用的抓取高度 mm
  # 全局默认抓取姿态。九宫格三层实际各自用自己的 phi/elbow（见 layers），
  # 这里只是给 plane_line / 未配 layers 时的兜底值。
  grasp_phi: -20.0    # 抓取时的末端姿态角（-90 = 夹爪竖直朝下）
  approach_dz: 8.0    # 接近位比抓取位高多少 mm
                      # ★ 不能大：中层可用区间只有 37mm 宽，抬高越多区间越窄。
                      #   实测 12mm 时第 6 格（中层最右列）抬高后直接不可达，
                      #   8mm 时 9 格全部可行。真要更大只能改中层姿态或加长连杆。
  # ★★ lift_dz = 0：本项目的抓取策略是"夹住后不抬高，让底盘把小车开走" ★★
  #   原因见下方大段注释：上层姿态抬高 20mm 后完全不可达（z=234.8 超出臂展），
  #   而"底盘退出"既避开了这个几何缺口，又正好是规则 3 描述的取药动作 ——
  #   夹爪夹住药瓶，底盘后撤，药瓶就被从货架上"拔"出来了。
  #   若改成 >0，上层会因不可达而退化成"贴着药瓶平移"，真机会刮擦。
  lift_dz: 0.0        # 抬起位比抓取位高多少 mm（0 = 不抬高，靠底盘退出）

  # ===========================================================================
  # ★★★ 2026-09-22 重大变更：8 槽位(4x2) -> 九宫格 9 槽位(3x3) ★★★
  # ===========================================================================
  # 起因：用户要求"九宫格"，并且要"用演示表里取上/中/下层那三个实测姿态
  #       来定三层的高度"。所以本段配置不再用逆解猜高度，而是直接用实测值。
  #
  # 三层的高度基准来自 config/pose_demo.yaml 的 B/C/D 三个真机微调过的姿态：
  #
  #   姿态            角度 s0/s1/s2        实测末端 (x, z) mm    本配置对应层
  #   B 取【上层】药  180/120/30            (0.1,   214.8)        第 3 层
  #   C 取【中层】药  180/40/110            (120.4, 193.6)        第 2 层
  #   D 取【下层】药  110/120/110           (206.7, 148.2)        第 1 层
  #
  # ★ 关键物理事实（决定了九宫格必须靠底盘配合才能成立）
  # --------------------------------------------------------------------------
  # 本机械臂是**平面 3R 串联臂**（3 个俯仰关节），末端被限制在单一竖直平面内，
  # 没有方位角自由度。它在不同高度上能伸到的水平距离 x 是**完全不同**的。
  #
  # ★ 注意：下面给的是【含全部舵机限位】的真实可用区间（逐 0.5mm 扫描），
  #   而不是纯几何可达区间 —— 两者差别很大：
  #     - 中层纯几何区间是 [-25, 158]，但左半边会顶到 s0 的 180° 上限，
  #       真正能用的只有右半边 [120.4, 157.4]，只有 37mm 宽！
  #     - 这个 37mm 才是整架列间距的真正瓶颈。
  #
  #     层           z      phi  elbow   真实可用 x           宽     3列→间距上限
  #     下层      148.2    -20   down   [ 163.7, 214.7]    51.0        25.5
  #     中层      193.6    -30   up     [ 120.4, 157.4]    37.0        18.5  ← 瓶颈
  #     上层      214.8    -30   down   [   0.2, 116.7]   116.5        58.2
  #
  # 三层可用区间**互不重叠** —— 层越高，臂越立，末端越靠后。
  # 所以"货架的同一列"在三层对应的是不同的机械臂 x。要让它变成真正的
  # 竖直九宫格，必须靠【底盘沿 x 方向前后移动】把每层的可用区间整体平移到
  # 货架的同一批列位置上：
  #     底盘横移 d 后，  机械臂看到的 x = X_货架 - d
  # 这正是规则 3"底盘移动到目标列"的物理含义，也是麦轮底盘在本项目里的
  # 核心价值 —— 不是为了跑，而是为了给机械臂补齐缺失的那个自由度。
  #
  # ★★★ 为什么 lift_dz = 0（本版最重要的设计决策）★★★
  # --------------------------------------------------------------------------
  # 上层姿态 (z=214.8) 往上抬高 20mm 后**完全不可达**：
  #     z=234.8 已超出 250mm 总臂展 -> reachable_x_range() 返回 None
  # 各层抬高能力实测：
  #     下层 可抬 20mm（区间收窄到 [142.8, 199.6]）
  #     中层 可抬 20mm（区间收窄到 [ -1.8, 119.9]，但限位内更窄）
  #     上层 只可抬 ≈12mm，且抬高后 x 被压到 [36.1, 64.1]（只剩 28mm 宽）
  # 如果坚持"先抬高再走"，上层必然失败，退化成"贴着药瓶平移"→真机刮擦。
  #
  # ★ 用户的解法规避了这个几何缺口：
  #       夹爪夹住药瓶后【不抬高】，直接让底盘把小车开走。
  #   药瓶被夹住、底盘后撤 → 药瓶从货架上被"拔"出来。
  #   这既不需要机械臂往上够（绕开臂展极限），又正好就是规则 3 描述的取药动作。
  #   所以 lift_dz = 0，lift 位与 grasp 位重合，动作序列变成：
  #       home -> approach(张开) -> grasp(张开) -> 夹紧 -> 底盘后退离开货架
  #
  # ★ 成品参数（已逐格验算 9/9 全可达且全限位内）
  # --------------------------------------------------------------------------
  # 正确的锚点：取【(抓取位可用) ∩ (抬高 approach_dz 后可用)】的公共区间
  #             —— 因为"接近位"也必须可达，否则真机会贴着药瓶平移。
  #   各层公共区间（approach_dz=8, lift_dz=0）：
  #     第1层(下层) [163.7, 208.7]  宽 45.0  中心 186.2   pitch<=22.5
  #     第2层(中层) [120.4, 144.4]  宽 24.0  中心 132.4   pitch<=12.0  ← 瓶颈
  #     第3层(上层) [ 18.1,  90.1]  宽 72.0  中心  54.1   pitch<=36.0
  #   → 整架 pitch <= 12.0mm（由中层定）
  #
  #   三层都【以各自公共区间的中心】摆 3 列，余量最大，最稳。
  #   层偏移 = 各层中心之差： 下层 0   中层 -53.8   上层 -132.1
  #   → 底盘在层间要前进 53.8 / 132.1 mm（一次只取一层药，所以没问题）。
  #
  #   于是三层 x_start（= 中心 - pitch，即第1列位置，pitch=12）：
  #       下层 174.2    中层 120.4    上层 42.1
  #
  # 当前填 pitch_x=12.0（= 上限，已无余量）。等货架到货后按药瓶直径重定：
  #     药瓶直径 <= 10mm  ->  pitch 12mm 可行
  #     药瓶直径 12mm 以上 -> **超上限**
  #        → 只能减到 2 列，或放宽中层姿态（改 phi / 换 elbow 分支），
  #          或加长连杆 L1~L3。这是本臂的硬极限，不是配置问题。
  #
  # ★ 等货架到货后要做的三件事
  # --------------------------------------------------------------------------
  #   1) 量出三层实际的 z（可能不等于 148.2/193.6/214.8），改 layers 里各层的 z；
  #      同时改 z_start（= 第1层的 z）以便老路径也能用。
  #   2) 量出列间距，改 pitch_x（上限 12.0mm），并确认药瓶放得下；
  #      若列的实际 x 与算出的 174.2 差得多，改 x_start。
  #   3) 重跑 `python tools/gen_poses.py` 生成新的 config/poses.json，
  #      然后真机逐个微调（用 tools/pose_demo.py 的手工微调功能）。
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # ★ 新增：九宫格三层各自的机械臂姿态参数（与实测姿态一一对应）
  # ---------------------------------------------------------------------------
  # 为什么必须给每层单独一份 (z, phi, elbow)：
  #   同一个目标点，逆解可能有两个分支（肘上 / 肘下），解出来的舵机角差别巨大。
  #   实测的三个姿态分别落在不同分支上：
  #       上层 B 用的是 elbow=down
  #       中层 C 用的是 elbow=up
  #       下层 D 用的是 elbow=down
  #   统一用一个分支去算，必然有一层的角度跟实测对不上（差几十度）。
  #   用 ik 反算已验证：按下面配置解出的中心列角度与实测姿态**完全一致**。
  #
  # phi = 末端姿态角。实测三层的第三段绝对角并**不是** -90（竖直朝下），
  #       而是 -30/-30/-20 —— 也就是夹爪略往前倾，正对着药瓶去夹。
  #       这里照抄实测值；若真机上想改成竖直朝下，把 phi 全改成 -90 再重生成。
  #
  # ★ x_start：该层用的【机械臂 x 基准】（不是货架坐标！）
  # ---------------------------------------------------------------------------
  # 为什么每层要各自的 x_start：
  #   货架是竖直对齐的九宫格 —— 同一列在三层的 X_货架 是同一个值。
  #   但本臂在三层的可用 x 差 130mm 以上，靠底盘横移补偿。
  #   把"货架列坐标"换算成"机械臂要看到的 x"时，每层要加一个固定偏移：
  #       x_arm(第 l 层, 第 c 列) = 货架列位置 + layer_offset(l)
  #   layer_offset 取"各层【抓取∩抬高】公共区间中心之差"最稳（三层都居中摆，
  #   余量最大）。approach_dz=8、lift_dz=0 时：
  #       公共中心：  下层 186.2   中层 132.4   上层 54.1
  #       层偏移  ：  下层 0       中层 -53.8   上层 -132.1
  #   于是三层的 x_start（= 中心 - pitch，即第1列位置，pitch=12）：
  #       下层 174.2    中层 120.4    上层 42.1
  #   → 底盘在层间移动量：中层比下层【前进 53.8mm】，上层比下层【前进 132.1mm】。
  #     （底盘前进 = 小车朝货架方向多走一段，机械臂就能用更靠后的姿态够到）
  #
  # ★ 这些数字等货架到货后按实测重定；改一个 x_start 只影响那一层。
  layers:
    - name: "下层"        # 对应照片三 D(4) 姿态
      z: 148.2
      phi: -20.0
      elbow: "down"
      x_start: 174.2      # 该层机械臂 x 基准（= 货架第1列在本层的机械臂位置）
      x_lo: 163.7         # 该层真实可用 x 下界（gen_poses 逐点扫描值）
      x_hi: 214.7         # 该层真实可用 x 上界
    - name: "中层"        # 对应照片四 C(3) 姿态
      z: 193.6
      phi: -30.0
      elbow: "up"
      x_start: 120.4
      x_lo: 120.4         # ★ 左半边会顶到 s0 的 180° 上限，公共区间只有 24mm 宽
      x_hi: 157.4
    - name: "上层"        # 对应照片二 B(2) 姿态
      z: 214.8
      phi: -30.0
      elbow: "down"
      x_start: 42.1
      x_lo: 0.2
      x_hi: 116.7

  # ---------------------------------------------------------------------------
  # ★ 三个特殊位（四元组 [s0, s1, s2, 夹爪角]）
  # ---------------------------------------------------------------------------
  # home    : 待命/复位位。取 pose_demo.yaml 的 A 姿态（复位立正，实测过），
  #           末端 (-20, 290) 在基座正上方收拢，投影落在基座内，不会撞货架，
  #           也给下方的麦轮底盘留出空间。
  # inspect : 过检位。把药举到相机前扫二维码的位置，必须"药瓶朝镜头、且在
  #           camera.fov 内"。这里取一个前伸中高度点 (140, 150)。
  # deliver : 交付位。把药递到用户面前，取更低更前伸的点 (180, 90)。
  # ★ 这三个位不参与"抓取位可达性"，但要保证在舵机限位内（gen_poses 会自检）。
  #   真机上按实际相机位置 / 接药位置微调（改这几个角度即可）。
  special_poses:
    home:    [180.0, 120.0, 120.0, 180.0]  # 上电/复位=姿态A，夹爪全开
    inspect: [138.5,  50.0,  90.0, 140.0]  # 过检时保持夹紧（140°=抓药夹紧，135 堵转）
    deliver: [128.0,  60.0, 100.0, 140.0]  # 交付时仍夹住（140°），到位后再 $GC,open

  # ---------------------------------------------------------------------------
  # ★ 底盘层间偏移（升/降到另一层取药时，底盘相对取第1层的位置要挪多少）
  # ---------------------------------------------------------------------------
  # 单位 mm，正 = 底盘朝货架方向【前进】，负 = 后退。
  # 由各层可用区间中心之差推出（见 layers 注释）。auto 模式取药时：
  #     底盘目标位移 = 列位移(由列号算出) + 层偏移(本表)
  layer_offset_mm:
    "1": 0.0
    "2": 53.8
    "3": 132.1
